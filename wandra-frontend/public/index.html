<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ff681a" />
    <meta name="description" content="Wandra — discover Bangladesh. Book tours and hotels and read travel stories." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Wandra — Discover Bangladesh</title>
    <script>
      // Apply a saved light/dark choice before the page renders (no flash).
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
