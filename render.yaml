# Render Blueprint: free backend for Wandra (see DEPLOY.md).
# In Render: New → Blueprint → pick this repository. You'll be asked for the
# values marked `sync: false`; SECRET_KEY is generated for you.
services:
  - type: web
    name: wandra-api
    runtime: python
    plan: free
    rootDir: wandra-backend/djangoApi
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py ensure_admin && gunicorn djangoApi.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
